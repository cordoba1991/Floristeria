<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Flores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="script.js" defer></script>
    <style>
        body { background-color: #f8f9fa; }
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Florería Online</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#carrito">Carrito</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2 class="text-center">Nuestras Flores</h2>
        <div class="row" id="productos">
            <!-- Productos dinámicos aquí -->
        </div>
    </div>
    
    <div class="container mt-4">
        <h2 class="text-center">Carrito de Compras</h2>
        <ul id="carrito" class="list-group"></ul>
        <button id="comprar" class="btn btn-success mt-3">Comprar</button>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const productos = [
                { id: 1, nombre: "Rosas Rojas", precio: 10, imagen: "https://via.placeholder.com/150" },
                { id: 2, nombre: "Tulipanes", precio: 15, imagen: "https://via.placeholder.com/150" },
                { id: 3, nombre: "Lirios", precio: 12, imagen: "https://via.placeholder.com/150" }
            ];
            
            const productosContainer = document.getElementById("productos");
            const carritoLista = document.getElementById("carrito");
            const carrito = [];
            
            productos.forEach(prod => {
                const card = document.createElement("div");
                card.classList.add("col-md-4");
                card.innerHTML = `
                    <div class="card product-card">
                        <img src="${prod.imagen}" class="card-img-top" alt="${prod.nombre}">
                        <div class="card-body">
                            <h5 class="card-title">${prod.nombre}</h5>
                            <p class="card-text">$${prod.precio}</p>
                            <button class="btn btn-primary" onclick="agregarAlCarrito(${prod.id})">Agregar al carrito</button>
                        </div>
                    </div>
                `;
                productosContainer.appendChild(card);
            });
            
            window.agregarAlCarrito = (id) => {
                const producto = productos.find(p => p.id === id);
                carrito.push(producto);
                actualizarCarrito();
            };
            
            function actualizarCarrito() {
                carritoLista.innerHTML = "";
                carrito.forEach((item, index) => {
                    const li = document.createElement("li");
                    li.classList.add("list-group-item");
                    li.textContent = `${item.nombre} - $${item.precio}`;
                    
                    const btnEliminar = document.createElement("button");
                    btnEliminar.textContent = "X";
                    btnEliminar.classList.add("btn", "btn-danger", "btn-sm", "ms-2");
                    btnEliminar.onclick = () => eliminarDelCarrito(index);
                    
                    li.appendChild(btnEliminar);
                    carritoLista.appendChild(li);
                });
            }
            
            window.eliminarDelCarrito = (index) => {
                carrito.splice(index, 1);
                actualizarCarrito();
            };
            
            document.getElementById("comprar").addEventListener("click", () => {
                if (carrito.length === 0) {
                    alert("El carrito está vacío");
                } else {
                    let mensaje = "Hola, quiero comprar: \n";
                    carrito.forEach(item => {
                        mensaje += `- ${item.nombre} ($${item.precio})\n`;
                    });
                    window.open(`https://wa.me/TUNUMERO?text=${encodeURIComponent(mensaje)}`);
                }
            });
        });
    </script>
</body>
</html>
